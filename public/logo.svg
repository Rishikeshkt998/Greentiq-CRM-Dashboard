      <stop offset="0%" stop-color="#22c58b"/>
      <stop offset="100%" stop-color="#0a6e4d"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#bg)"/>

  <!-- Perfectly Symmetric Leaf Contour -->
